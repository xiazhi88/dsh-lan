# dshgo bundle patch —— 只挂自己这一行。
#
# ── 为什么这里不再挂 dsh-web-mobile（曾经挂过，是个错误）──
#
# 曾经在这里插入第二行把 dsh-web-mobile 一起挂上，想让用户「装一个包就够」。
# 那个做法是错的，而且失败方式很严重：
#
#   市场的一键安装会热挂载它，读的就是这个文件 ——
#   rows = parseSimplePatch(readFileSync(…'cordis.patch.yml'))
#   于是它不只挂了 dshgo，还把 dsh-web-mobile 又挂了一次。如果用户自己
#   也装过 dsh-web-mobile（它本来就在 profile 的 bundles 里），就变成双重挂载：
#
#     failed to apply loader entry (dsh-web-mobile):
#     locale namespace "mobileNav" already has locale "zh"
#
#   这不是一个插件失效，是**整个 dsh web 起不来** —— 连市场的卸载页面都打不开，
#   用户只能手改文件才能恢复。
#
# 而且 dsh-web-mobile 的宿主半并不空：它会 patch http.ServerResponse.prototype
# 做响应压缩、还会注册路由。挂两次是真的有害。
#
# 所以分工回到清晰的一人一半：dshgo 只做局域网转发 + 访问闸门，移动端适配由**内联**解决
# （见 client/vendor/，MIT，保留署名）—— 由客户端半在运行时挂一次，不再经过这个
# patch 文件，也就不会再出现「同一个插件被挂两次」。一行仍然只挂一行。
- insert:
    - id: dshgo
      # 必须是 npm 上的**包名**，Cordis 靠它解析。
      # 带 scope 是因为 npm 的防抢注保护不允许 `dshgo`（与已有的 `dsh-go` 太像）。
      # @ 在 YAML 里是保留字符，所以加引号。
      name: '@xiazhi88/dshgo'
